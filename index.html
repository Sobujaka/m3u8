<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3U Auto-Detecting Editor</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 15px; }
    h2 { text-align: center; margin-bottom: 15px; color: #00e676; }
    
    .upload-container {
      background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px;
      display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    }
    input[type="file"], input[type="url"] { 
      background: #2a2a2a; color: #fff; padding: 8px 12px; border-radius: 5px; border: 1px solid #444; font-size: 14px;
    }
    input[type="url"] { width: 300px; }

    /* Loading Status Bar */
    #status {
      display: none; background: #263238; color: #80deea; padding: 10px;
      text-align: center; border-radius: 5px; margin-bottom: 15px; font-weight: bold;
    }

    .main-layout { display: flex; gap: 15px; height: calc(100vh - 190px); }
    
    .left-panel { flex: 1.2; background: #000; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
    .video-js { width: 100% !important; height: 100% !important; }

    .right-panel { flex: 1; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; padding: 10px; }
    
    .controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
    .btn { background: #333; color: #fff; border: none; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .btn:hover { background: #444; }
    .btn-danger { background: #d32f2f; }
    .btn-danger:hover { background: #f44336; }
    .btn-success { background: #388e3c; }
    .btn-success:hover { background: #4caf50; }
    .btn-edit { background: #0288d1; color: #fff; }
    .btn-edit:hover { background: #01579b; }
    .btn-name { background: #7b1fa2; color: #fff; }
    .btn-name:hover { background: #4a148c; }
    .btn-group { background: #d81b60; color: #fff; }
    .btn-group:hover { background: #880e4f; }
    .btn-select-all { background: #f57c00; color: #fff; }
    .btn-select-all:hover { background: #e65100; }

    .channel-list { flex: 1; overflow-y: auto; background: #121212; border-radius: 5px; padding: 5px; }
    .channel-item-wrapper {
      display: flex; flex-direction: column; background: #252525; margin-bottom: 5px; border-radius: 5px; border: 1px solid transparent;
    }
    .channel-item-wrapper.active { border-color: #00e676; background: #1c3829; }
    .channel-item {
      display: flex; align-items: center; gap: 8px; padding: 8px; cursor: pointer;
    }
    .channel-item:hover { background: rgba(255, 255, 255, 0.05); }
    .channel-logo { width: 35px; height: 35px; object-fit: contain; background: #000; border-radius: 4px; }
    .channel-title-container { flex: 1; display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .channel-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-tag { background: #00e676; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .checkbox { width: 18px; height: 18px; cursor: pointer; }

    /* Edit Box Container */
    .edit-box {
      display: none; gap: 5px; padding: 5px 8px 8px 8px; background: #1a1a1a; border-top: 1px solid #333;
    }
    .edit-box input[type="text"] {
      flex: 1; padding: 6px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px;
    }
  </style>
</head>
<body>

  <h2>M3U Auto-Detecting Playlist Editor</h2>

  <div class="upload-container">
    <label>M3U ফাইল সিলেক্ট করুন: </label>
    <input type="file" id="fileInput" accept=".m3u, .m3u8" multiple>
    
    <span style="color: #888; font-weight: bold;">অথবা</span>

    <!-- নতুন লিংক দেওয়ার ইনপুট অপশন -->
    <input type="url" id="urlInput" placeholder="M3U URL লিংক পেস্ট করুন...">
    <button class="btn btn-success" onclick="loadFromUrl()">লোড করুন</button>
  </div>

  <!-- Real-time Checking Status -->
  <div id="status">চ্যানেল ফিল্টার করা হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</div>

  <div class="main-layout">
    <div class="left-panel">
      <video id="myPlayer" class="video-js vjs-default-skin" controls preload="auto"></video>
    </div>

    <div class="right-panel">
      <div class="controls">
        <button class="btn btn-select-all" id="selectAllBtn" onclick="toggleSelectAll()">Select All</button>
        <button class="btn btn-danger" onclick="deleteSelected()">Delete Selected</button>
        <button class="btn" onclick="moveUp()">Up ▲</button>
        <button class="btn" onclick="moveDown()">Down ▼</button>
        <button class="btn btn-success" onclick="downloadSelected()">Download Selected</button>
      </div>

      <div class="channel-list" id="channelList">
        <p style="text-align: center; color: #888; margin-top: 20px;">কোনো M3U ফাইল বা লিংক লোড করা হয়নি</p>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <script>
    let channels = [];
    let rawChannels = [];
    let isAllSelected = false;
    let player = videojs('myPlayer');

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      rawChannels = [];
      let filesRead = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          parseM3U(event.target.result);
          filesRead++;
          if (filesRead === files.length) {
            filterAndAppendChannels();
          }
        };
        reader.readAsText(file);
      });

      this.value = "";
    });

    // লিংক থেকে M3U প্লেলিস্ট লোড করার ফাংশন
    async function loadFromUrl() {
      const urlInput = document.getElementById('urlInput');
      const url = urlInput.value.trim();

      if (!url) {
        alert("অনুগ্রহ করে একটি বৈধ M3U URL লিংক দিন!");
        return;
      }

      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.innerText = 'লিংক থেকে প্লেলিস্ট ডাউনলোড করা হচ্ছে...';

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const content = await response.text();
        rawChannels = [];
        parseM3U(content);
        
        urlInput.value = '';
        await filterAndAppendChannels();
      } catch (error) {
        alert("লিংক থেকে ডেটা লোড করতে সমস্যা হয়েছে! CORS নীতি অথবা সার্ভার ইস্যু থাকতে পারে।");
        statusDiv.style.display = 'none';
      }
    }

    function parseM3U(content) {
      const lines = content.split('\n');
      let currentChannel = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          currentChannel = {};
          
          // extract logo
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          currentChannel.logo = logoMatch ? logoMatch[1] : '';

          // extract group-title
          const groupMatch = line.match(/group-title="([^"]*)"/);
          currentChannel.group = groupMatch ? groupMatch[1] : '';

          const titleParts = line.split(',');
          currentChannel.title = titleParts.length > 1 ? titleParts.slice(1).join(',').trim() : 'Unknown Channel';
          currentChannel.extinf = line;
          currentChannel.selected = false;
        } else if (line && !line.startsWith('#') && currentChannel) {
          currentChannel.url = line;
          rawChannels.push(currentChannel);
          currentChannel = null;
        }
      });
    }

    async function filterAndAppendChannels() {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      
      const newWorkingChannels = [];

      for (let i = 0; i < rawChannels.length; i++) {
        const ch = rawChannels[i];
        statusDiv.innerText = `চ্যানেল চেক করা হচ্ছে: ${i + 1}/${rawChannels.length} (নতুন সচল: ${newWorkingChannels.length})`;

        const isWorking = await checkStream(ch.url);
        if (isWorking) {
          newWorkingChannels.push(ch);
        }
      }

      channels = channels.concat(newWorkingChannels);

      statusDiv.style.display = 'none';
      renderChannels();
    }

    function checkStream(url) {
      return new Promise((resolve) => {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        fetch(url, { method: 'HEAD', signal: controller.signal, mode: 'no-cors' })
          .then(() => {
            clearTimeout(timeoutId);
            resolve(true);
          })
          .catch(() => {
            clearTimeout(timeoutId);
            resolve(false);
          });
      });
    }

    function renderChannels() {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '';

      if (channels.length === 0) {
        listContainer.innerHTML = '<p style="text-align: center; color: #888; margin-top: 20px;">কোনো সচল চ্যানেল পাওয়া যায়নি</p>';
        return;
      }

      channels.forEach((channel, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'channel-item-wrapper';
        wrapper.id = `channel-wrapper-${index}`;

        const fallbackLogo = 'https://via.placeholder.com/35?text=TV';
        const groupTagHtml = channel.group ? `<span class="group-tag" id="group-tag-${index}">${channel.group}</span>` : `<span class="group-tag" id="group-tag-${index}" style="display:none;"></span>`;

        wrapper.innerHTML = `
          <div class="channel-item">
            <button class="btn btn-edit" onclick="toggleEditBox(event, ${index}, 'image')">Edit</button>
            <button class="btn btn-name" onclick="toggleEditBox(event, ${index}, 'name')">Name</button>
            <button class="btn btn-group" onclick="toggleEditBox(event, ${index}, 'group')">Group</button>
            <input type="checkbox" class="checkbox" ${channel.selected ? 'checked' : ''} onclick="toggleSelect(event, ${index})">
            <img src="${channel.logo || fallbackLogo}" class="channel-logo" id="logo-img-${index}" onerror="this.src='${fallbackLogo}'">
            <div class="channel-title-container">
              <span class="channel-name" id="channel-name-${index}">${channel.title}</span>
              ${groupTagHtml}
            </div>
          </div>
          <div class="edit-box" id="edit-box-${index}">
            <input type="text" id="edit-input-${index}" placeholder="">
            <button class="btn btn-success" id="edit-save-btn-${index}">Save</button>
          </div>
        `;

        wrapper.querySelector('.channel-item').onclick = (e) => {
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
            playChannel(channel.url, wrapper);
          }
        };

        listContainer.appendChild(wrapper);
      });

      updateSelectAllButtonText();
    }

    function toggleEditBox(event, index, mode) {
      event.stopPropagation();
      const editBox = document.getElementById(`edit-box-${index}`);
      const input = document.getElementById(`edit-input-${index}`);
      const saveBtn = document.getElementById(`edit-save-btn-${index}`);

      if (editBox.style.display === 'flex' && editBox.dataset.mode === mode) {
        editBox.style.display = 'none';
        return;
      }

      editBox.style.display = 'flex';
      editBox.dataset.mode = mode;
      input.value = '';

      if (mode === 'image') {
        input.placeholder = 'নতুন ইমেজের লিংক দিন...';
        saveBtn.onclick = (e) => saveLogo(e, index);
      } else if (mode === 'name') {
        input.placeholder = 'নতুন চ্যানেলের নাম দিন...';
        saveBtn.onclick = (e) => saveName(e, index);
      } else if (mode === 'group') {
        input.placeholder = 'গ্রুপ টাইটেল লিখুন...';
        saveBtn.onclick = (e) => saveGroup(e, index);
      }

      input.focus();
    }

    function saveLogo(event, index) {
      event.stopPropagation();
      const input = document.getElementById(`edit-input-${index}`);
      const newLogoUrl = input.value.trim();

      if (newLogoUrl) {
        channels[index].logo = newLogoUrl;

        if (channels[index].extinf.includes('tvg-logo="')) {
          channels[index].extinf = channels[index].extinf.replace(/tvg-logo="[^"]*"/, `tvg-logo="${newLogoUrl}"`);
        } else {
          channels[index].extinf = channels[index].extinf.replace('#EXTINF:-1', `#EXTINF:-1 tvg-logo="${newLogoUrl}"`);
        }

        const img = document.getElementById(`logo-img-${index}`);
        if (img) img.src = newLogoUrl;
      }

      document.getElementById(`edit-box-${index}`).style.display = 'none';
    }

    function saveName(event, index) {
      event.stopPropagation();
      const input = document.getElementById(`edit-input-${index}`);
      const newName = input.value.trim();

      if (newName) {
        channels[index].title = newName;

        const extinfParts = channels[index].extinf.split(',');
        if (extinfParts.length > 1) {
          extinfParts[extinfParts.length - 1] = ' ' + newName;
          channels[index].extinf = extinfParts.join(',');
        } else {
          channels[index].extinf += ',' + newName;
        }

        const nameSpan = document.getElementById(`channel-name-${index}`);
        if (nameSpan) nameSpan.innerText = newName;
      }

      document.getElementById(`edit-box-${index}`).style.display = 'none';
    }

    function saveGroup(event, index) {
      event.stopPropagation();
      const input = document.getElementById(`edit-input-${index}`);
      const newGroup = input.value.trim();

      if (newGroup) {
        channels[index].group = newGroup;

        if (channels[index].extinf.includes('group-title="')) {
          channels[index].extinf = channels[index].extinf.replace(/group-title="[^"]*"/, `group-title="${newGroup}"`);
        } else {
          channels[index].extinf = channels[index].extinf.replace('#EXTINF:-1', `#EXTINF:-1 group-title="${newGroup}"`);
        }

        const groupTag = document.getElementById(`group-tag-${index}`);
        if (groupTag) {
          groupTag.innerText = newGroup;
          groupTag.style.display = 'inline-block';
        }
      }

      document.getElementById(`edit-box-${index}`).style.display = 'none';
    }

    function playChannel(url, element) {
      document.querySelectorAll('.channel-item-wrapper').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      player.src({
        src: url,
        type: url.includes('.m3u8') ? 'application/x-mpegURL' : 'video/mp4'
      });
      player.play();
    }

    function toggleSelect(event, index) {
      event.stopPropagation();
      channels[index].selected = event.target.checked;
      updateSelectAllButtonText();
    }

    function toggleSelectAll() {
      if (channels.length === 0) return;

      isAllSelected = !isAllSelected;
      channels.forEach(ch => ch.selected = isAllSelected);
      renderChannels();
    }

    function updateSelectAllButtonText() {
      const btn = document.getElementById('selectAllBtn');
      if (!btn) return;
      
      const allSelected = channels.length > 0 && channels.every(ch => ch.selected);
      isAllSelected = allSelected;
      btn.innerText = allSelected ? 'Deselect All' : 'Select All';
    }

    function deleteSelected() {
      channels = channels.filter(ch => !ch.selected);
      renderChannels();
    }

    function moveUp() {
      for (let i = 1; i < channels.length; i++) {
        if (channels[i].selected && !channels[i - 1].selected) {
          [channels[i], channels[i - 1]] = [channels[i - 1], channels[i]];
        }
      }
      renderChannels();
    }

    function moveDown() {
      for (let i = channels.length - 2; i >= 0; i--) {
        if (channels[i].selected && !channels[i + 1].selected) {
          [channels[i], channels[i + 1]] = [channels[i + 1], channels[i]];
        }
      }
      renderChannels();
    }

    function downloadSelected() {
      const selectedChannels = channels.filter(ch => ch.selected);

      if (selectedChannels.length === 0) {
        alert("ডাউনলোড করার জন্য কোনো চ্যানেল সিলেক্ট করা হয়নি! অনুগ্রহ করে চেকবোক্সে টিক দিন।");
        return;
      }

      let fileName = prompt("ফাইলটির নাম লিখুন (এক্সটেনশন ছাড়া):", "my_playlist");
      if (!fileName) return;

      fileName = fileName.trim();
      if (!fileName.endsWith('.m3u')) {
        fileName += '.m3u';
      }

      let m3uContent = "#EXTM3U\n";
      selectedChannels.forEach(ch => {
        m3uContent += `${ch.extinf}\n${ch.url}\n`;
      });

      const blob = new Blob([m3uContent], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
    }
  </script>
</body>
</html>
